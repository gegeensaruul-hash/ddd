<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f4f4; }
        nav { background: #333; padding: 15px 30px; display: flex; gap: 20px; }
        nav a { color: white; text-decoration: none; padding: 8px 16px; border-radius: 4px; }
        nav a.active { background: #6c63ff; }
        .container { max-width: 800px; margin: 50px auto; background: white; padding: 40px; border-radius: 8px; }
        h1 { margin-bottom: 30px; color: #333; }
        .contact-info { display: flex; gap: 30px; margin-bottom: 40px; }
        .contact-card { text-align: center; flex: 1; padding: 20px; border: 1px solid #eee; border-radius: 8px; }
        .contact-card img { width: 80px; height: 80px; border-radius: 50%; margin-bottom: 10px; }
        .contact-card h3 { margin-bottom: 5px; }
        .contact-card p { color: #666; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; }
        textarea { height: 120px; resize: vertical; }
        button { background: #6c63ff; color: white; padding: 12px 30px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="About.html">About</a>
        <a href="Contact.html" class="active">Contact Us</a>
    </nav>

    <div class="container">
        <h1>Contact Us</h1>

        <div class="contact-info">
            <div class="contact-card">
                <img src="https://randomuser.me/api/portraits/men/10.jpg" alt="Support">
                <h3>John Doe</h3>
                <p>Support Manager</p>
                <p>john.doe@company.com</p>
                <p>+1 (555) 123-4567</p>
            </div>
            <div class="contact-card">
                <img src="https://randomuser.me/api/portraits/women/11.jpg" alt="Sales">
                <h3>Jane Smith</h3>
                <p>Sales Director</p>
                <p>jane.smith@company.com</p>
                <p>+1 (555) 987-6543</p>
            </div>
        </div>

        <h2 style="margin-bottom:20px;">Send us a message</h2>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" placeholder="Your name">
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" placeholder="your@email.com">
        </div>
        <div class="form-group">
            <label>Message</label>
            <textarea placeholder="Write your message here..."></textarea>
        </div>
        <button>Send Message</button>
    </div>
</body>
</html>
